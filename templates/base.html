<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        IGNITE
        {% endblock %}
    </title>

    <!-- =========================
            GOOGLE FONT
    ========================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- =========================
        MATERIAL SYMBOLS
    ========================== -->

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0">

    <!-- =========================
            GLOBAL CSS
    ========================== -->

    <link rel="stylesheet" href="{{ url_for('static', path='CSS/theme.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', path='CSS/components.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', path='CSS/animations.css') }}">

    <!-- =========================
        PAGE SPECIFIC CSS
    ========================== -->

    {% block page_css %}
    {% endblock %}

</head>

<body>

    {% block content %}
    {% endblock %}

</body>

</html>
